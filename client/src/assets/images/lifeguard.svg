<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#0082ce" />
  
  <!-- Water -->
  <path d="M0,300 C100,280 200,320 300,300 C400,280 500,320 600,300 L600,400 L0,400 Z" fill="#0068a5" />
  <path d="M0,320 C100,300 200,340 300,320 C400,300 500,340 600,320 L600,400 L0,400 Z" fill="#005190" />
  
  <!-- Lifeguard tower -->
  <rect x="375" y="150" width="120" height="100" fill="#e74c3c" />
  <rect x="395" y="250" width="80" height="50" fill="#c0392b" />
  <rect x="425" y="250" width="20" height="100" fill="#a93226" />
  <rect x="380" y="142" width="110" height="15" fill="#e67e22" />
  <rect x="385" y="130" width="100" height="12" fill="#f39c12" />
  
  <!-- Lifeguard -->
  <circle cx="435" cy="180" r="20" fill="#f5b041" /> <!-- Head -->
  <rect x="425" y="200" width="20" height="30" fill="#f5b041" /> <!-- Body -->
  <rect x="420" y="205" width="5" height="15" fill="#f5b041" /> <!-- Left arm -->
  <rect x="445" y="205" width="5" height="20" fill="#f5b041" /> <!-- Right arm -->
  <rect x="425" y="230" width="8" height="15" fill="#f5b041" /> <!-- Left leg -->
  <rect x="437" y="230" width="8" height="15" fill="#f5b041" /> <!-- Right leg -->
  <rect x="420" y="195" width="30" height="5" fill="#e74c3c" /> <!-- Red band -->
  
  <!-- Sun -->
  <circle cx="100" cy="80" r="40" fill="#f1c40f" />
  <line x1="100" y1="20" x2="100" y2="10" stroke="#f1c40f" stroke-width="6" />
  <line x1="100" y1="150" x2="100" y2="140" stroke="#f1c40f" stroke-width="6" />
  <line x1="40" y1="80" x2="30" y2="80" stroke="#f1c40f" stroke-width="6" />
  <line x1="170" y1="80" x2="160" y2="80" stroke="#f1c40f" stroke-width="6" />
  <line x1="58" y1="38" x2="50" y2="30" stroke="#f1c40f" stroke-width="6" />
  <line x1="142" y1="122" x2="150" y2="130" stroke="#f1c40f" stroke-width="6" />
  <line x1="58" y1="122" x2="50" y2="130" stroke="#f1c40f" stroke-width="6" />
  <line x1="142" y1="38" x2="150" y2="30" stroke="#f1c40f" stroke-width="6" />
  
  <!-- Life ring -->
  <circle cx="240" cy="270" r="40" fill="#e74c3c" />
  <circle cx="240" cy="270" r="25" fill="#0082ce" />
  <rect x="210" y="265" width="60" height="10" fill="white" />
  <rect x="235" y="240" width="10" height="60" fill="white" />
</svg>