<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Water slide -->
  <path d="M80,20 C60,20 20,30 20,70" stroke="#3498db" fill="none" stroke-width="8" stroke-linecap="round" />
  <!-- Person sliding -->
  <circle cx="50" cy="45" r="5" fill="#f39c12" /> <!-- Head -->
  <rect x="48" y="50" width="4" height="10" transform="rotate(45, 50, 50)" fill="#f39c12" /> <!-- Body -->
  <!-- Pool -->
  <path d="M10,80 C25,75 40,85 55,80 C70,75 85,85 100,80" stroke="#29b6f6" fill="none" stroke-width="3" />
  <path d="M10,90 C25,85 40,95 55,90 C70,85 85,95 100,90" stroke="#29b6f6" fill="none" stroke-width="3" />
  <!-- Sun -->
  <circle cx="80" cy="20" r="10" fill="#f1c40f" />
  <line x1="80" y1="5" x2="80" y2="10" stroke="#f1c40f" stroke-width="2" />
  <line x1="80" y1="30" x2="80" y2="35" stroke="#f1c40f" stroke-width="2" />
  <line x1="65" y1="20" x2="70" y2="20" stroke="#f1c40f" stroke-width="2" />
  <line x1="90" y1="20" x2="95" y2="20" stroke="#f1c40f" stroke-width="2" />
</svg>