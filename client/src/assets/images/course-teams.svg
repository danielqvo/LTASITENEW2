<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Group of people -->
  <circle cx="30" cy="30" r="10" fill="#3498db" /> <!-- Person 1 head -->
  <rect x="25" y="40" width="10" height="20" fill="#3498db" /> <!-- Person 1 body -->
  
  <circle cx="50" cy="25" r="10" fill="#e74c3c" /> <!-- Person 2 head -->
  <rect x="45" y="35" width="10" height="20" fill="#e74c3c" /> <!-- Person 2 body -->
  
  <circle cx="70" cy="30" r="10" fill="#2ecc71" /> <!-- Person 3 head -->
  <rect x="65" y="40" width="10" height="20" fill="#2ecc71" /> <!-- Person 3 body -->
  
  <!-- Rescue tube connecting them -->
  <rect x="20" y="50" width="60" height="8" rx="4" fill="#e74c3c" />
  
  <!-- Water -->
  <path d="M10,75 C25,70 40,80 55,75 C70,70 85,80 100,75" stroke="#29b6f6" fill="none" stroke-width="3" />
  <path d="M10,85 C25,80 40,90 55,85 C70,80 85,90 100,85" stroke="#29b6f6" fill="none" stroke-width="3" />
</svg>