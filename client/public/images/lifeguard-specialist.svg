<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle background -->
  <circle cx="200" cy="200" r="200" fill="#88C7DC"/>
  
  <!-- Pool background -->
  <rect x="0" y="240" width="400" height="160" fill="#5ABEDC"/>
  
  <!-- Face -->
  <ellipse cx="200" cy="160" rx="120" ry="140" fill="#FFD7BF"/>
  
  <!-- Hair -->
  <path d="M80,150 C100,50 300,50 320,150 C280,130 240,140 200,140 C160,140 120,130 80,150" fill="#8A5A44"/>
  
  <!-- Smile -->
  <path d="M150,180 Q200,220 250,180" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="160" cy="150" rx="15" ry="10" fill="#333"/>
  <ellipse cx="240" cy="150" rx="15" ry="10" fill="#333"/>
  
  <!-- Eyebrows -->
  <path d="M140,130 Q160,120 180,130" fill="none" stroke="#8A5A44" stroke-width="4"/>
  <path d="M220,130 Q240,120 260,130" fill="none" stroke="#8A5A44" stroke-width="4"/>
  
  <!-- Red uniform -->
  <path d="M80,240 C80,200 320,200 320,240 L320,400 L80,400 Z" fill="#DF0000"/>
  
  <!-- Collar -->
  <path d="M150,240 L200,300 L250,240" fill="none" stroke="#AA0000" stroke-width="8"/>
  
  <!-- Necklace -->
  <path d="M190,240 L200,260 L210,240" fill="#FFCC00" stroke="#FFCC00" stroke-width="2"/>
  
  <!-- Teeth -->
