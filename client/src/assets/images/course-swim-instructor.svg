<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Instructor -->
  <circle cx="30" cy="30" r="10" fill="#3498db" /> <!-- Head -->
  <rect x="25" y="40" width="10" height="20" fill="#3498db" /> <!-- Body -->
  <rect x="15" y="45" width="10" height="5" fill="#3498db" /> <!-- Left arm -->
  <rect x="35" y="45" width="15" height="5" fill="#3498db" /> <!-- Right arm pointing -->
  <!-- Student -->
  <circle cx="65" cy="45" r="8" fill="#f1c40f" /> <!-- Head -->
  <path d="M60,53 C65,50 70,55 75,53" stroke="#f1c40f" fill="none" stroke-width="5" /> <!-- Body swimming -->
  <!-- Water -->
  <path d="M10,75 C25,70 40,80 55,75 C70,70 85,80 100,75" stroke="#29b6f6" fill="none" stroke-width="3" />
  <path d="M10,85 C25,80 40,90 55,85 C70,80 85,90 100,85" stroke="#29b6f6" fill="none" stroke-width="3" />
  <!-- Whistle -->
